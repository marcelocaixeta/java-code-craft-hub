services:
  codecrafthub:
    build: .
    image: codecrafthub:latest
    container_name: codecrafthub-api
    ports:
      - "8080:8080"
    volumes:
      # Persiste os dados no host, sem precisar de banco.
      # O arquivo ./courses.json é criado antes do primeiro `up`.
      - ./courses.json:/app/courses.json
    environment:
      - JAVA_OPTS=
    restart: unless-stopped

  # Painel frontend (HTML/CSS/JS puro) — sem instalar nada no host
  frontend:
    image: nginx:alpine
    container_name: codecrafthub-ui
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - codecrafthub
    restart: unless-stopped
